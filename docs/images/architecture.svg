<svg xmlns="http://www.w3.org/2000/svg" width="760" height="880" viewBox="0 0 760 880" role="img" aria-labelledby="title desc">
<title id="title">Scanner data flow</title>
<desc id="desc">Entry points configure indexed components, discover and filter files, extract and score findings, apply suppression, write masked reports and decide failure. The Maven report goal reads saved JSON.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs>
<g font-family="sans-serif" font-size="16" text-anchor="middle">
<rect x="120" y="20" width="520" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="380" y="50" fill="#0f172a">Maven scan goal or CLI</text>
<path d="M380,68 V96" stroke="#334155" marker-end="url(#arrow)"/>
<rect x="120" y="98" width="520" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="380" y="128" fill="#0f172a">Configuration and indexed components</text>
<path d="M380,146 V174" stroke="#334155" marker-end="url(#arrow)"/>
<rect x="120" y="176" width="520" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="380" y="206" fill="#0f172a">Working-tree discovery or staged index paths</text>
<path d="M380,224 V252" stroke="#334155" marker-end="url(#arrow)"/>
<rect x="120" y="254" width="520" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="380" y="284" fill="#0f172a">Directory, size and binary filters; text decoding</text>
<path d="M380,302 V330" stroke="#334155" marker-end="url(#arrow)"/>
<rect x="120" y="332" width="520" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="380" y="362" fill="#0f172a">Secret extractors</text>
<path d="M380,380 V408" stroke="#334155" marker-end="url(#arrow)"/>
<rect x="120" y="410" width="520" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="380" y="440" fill="#0f172a">Finding evaluators</text>
<path d="M380,458 V486" stroke="#334155" marker-end="url(#arrow)"/>
<rect x="120" y="488" width="520" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="380" y="518" fill="#0f172a">File post-processors</text>
<path d="M380,536 V564" stroke="#334155" marker-end="url(#arrow)"/>
<rect x="120" y="566" width="520" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="380" y="596" fill="#0f172a">File and inline suppression</text>
<path d="M380,614 V642" stroke="#334155" marker-end="url(#arrow)"/>
<rect x="120" y="644" width="520" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="380" y="674" fill="#0f172a">Console and masked JSON reports</text>
<path d="M380,692 V740 H190 V768 M380,740 H570 V768" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
<path d="M190,740 V768" stroke="#334155" marker-end="url(#arrow)"/>
<rect x="20" y="770" width="340" height="64" rx="8" fill="#f0fdf4" stroke="#15803d"/>
<text x="190" y="808" fill="#0f172a">Failure policy and exit status</text>
<rect x="400" y="770" width="340" height="64" rx="8" fill="#f0fdf4" stroke="#15803d"/>
<text x="570" y="796" fill="#0f172a">Maven report goal</text>
<text x="570" y="819" fill="#0f172a">reads saved JSON</text>
</g></svg>
